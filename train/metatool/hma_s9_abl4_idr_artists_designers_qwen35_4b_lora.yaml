### MetaTool occupation HMA SFT · s9 abl4_idr · artists&designers · Qwen3.5-4B
### 对齐官方 / LF：qwen3_6，enable_thinking: false
### abl4 目录（无 leftover/near/far）+ IDR InfoNCE main
### 数据：Clean↔abl4 mix 双向对。不覆盖 abl4 / s9 / p* / q ckpt
###   python3 scripts/build_hma_occupation_s9_idr.py
###   把 metatool_occ_artists_designers_hma_s9_abl4_idr.jsonl 与 dataset_info_fragment_s9_idr 拷到 LlamaFactory-new/data/

### model
model_name_or_path: /media/cfs/ida-algo-train/ckpts/Qwen3.5-4B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: metatool_occ_artists_designers_hma_s9_abl4_idr
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
template: qwen3_6
enable_thinking: false
cutoff_len: 8192

### IDR  L = CE(anchor) + 0.1 * L_IDR
use_idr_loss: true
idr_alpha: 0.1
idr_layer_idx: null
idr_use_contrastive: true
idr_temperature: 0.1
# 8 卡 × per_device=1 → InfoNCE 负样本跨卡 all_gather
idr_use_distributed_negatives: true

### output
output_dir: /media/cfs/ida-algo-train/wjj/ckpts/metatool_occ_artists_designers_hma_s9_abl4_idr_lora_qwen35_4b
logging_steps: 10
save_steps: 10000000000
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
gradient_checkpointing: true
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
mask_history: false

### eval
val_size: 0.0
per_device_eval_batch_size: 1
