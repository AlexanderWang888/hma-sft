### 评测不动官方 TelecomTools / 114。本档不写 HMA / IDR
### 超参对齐论文 4B：r16/α32、1ep、lr 5e-5
### template 对齐官方 / LF：qwen3_6，enable_thinking: false
###
### 1) bash tau2_hma/scripts/11_build_telecom_vanilla.sh
### 2) jsonl + dataset_info 段拷到 PinoModel/data/
### 3) yaml 放 examples/train_lora/（PinoModel 现成目录）
### 4) FORCE_TORCHRUN=1 NNODES=1 NPROC_PER_NODE=16 \
###      llamafactory-cli train examples/train_lora/train_tau2_telecom_vanilla_qwen35_4b_lora.yaml

### model
model_name_or_path: /media/cfs/ida-algo-train/ckpts/Qwen3.5-4B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: tau2_telecom_vanilla
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
template: qwen3_6
enable_thinking: false
cutoff_len: 12288

### output
output_dir: /media/cfs/ida-algo-train/wjj/ckpts/tau2_telecom_vanilla_lora_qwen35_4b
logging_steps: 10
save_steps: 10000000000
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
gradient_checkpointing: true
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
mask_history: false

### eval
val_size: 0.0
per_device_eval_batch_size: 1
